{{define "project-details"}}
{{template "header" .Titre}}
        <article class="detail">
            <img class="cover" src="/static/images/projects/{{.Image}}" alt="{{.Titre}}">
            <h1>{{.Titre}}</h1>
            <p>{{.Technologies}}</p>
            <p>{{.Introduction}}</p>
            <p>{{.Presentation}}</p>
            <p>{{.Fonctionnalites}}</p>
            <p>{{.Depot}}</p>
            <p>{{.Video}}</p>

            <a class="btn" href="/projects">Retour à la liste des projets</a>
        </article>
{{template "footer"}}
{{end}}
